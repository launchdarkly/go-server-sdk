name: Common CI
on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use for the jobs."
        required: true
        type: string

jobs:
  unit-test-and-coverage:
    runs-on: ubuntu-latest
    name: 'Unit Tests and Coverage'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/unit-tests
        with:
          lint: 'true'
          test-target: sdk-test
      - uses: ./.github/actions/coverage
        with:
          enforce: 'false'

  contract-tests-v2:
    runs-on: ubuntu-latest
    name: 'Contract Tests - v2'
    env:
      TEST_SERVICE_PORT: 10000

    services:
      redis:
        image: redis
        ports:
            - 6379:6379
      dynamodb:
        image: amazon/dynamodb-local
        ports:
            - 8000:8000
      consul:
        image: hashicorp/consul
        ports:
            - 8500:8500
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/get-go-version
        id: go-version
      - name: Make workspace
        run: make workspace
      - name: Build test service
        run: make build-contract-tests
      - name: Start test service in background
        run: make start-contract-test-service-bg
      - uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1.2.0
        with:
          enable_persistence_tests: 'true'
          test_service_port: ${{ env.TEST_SERVICE_PORT }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test service logs
        uses: actions/upload-artifact@v4
        with:
          name: Contract-test-service-logs-v2-${{ steps.go-version.outputs.version }}
          path: /tmp/sdk-contract-test-service.log
          
  contract-tests-fdv2:
    runs-on: ubuntu-latest
    name: 'Contract Tests - feat/fdv2'
    env:
      TEST_SERVICE_PORT: 10000

    services:
      redis:
        image: redis
        ports:
            - 6379:6379
      dynamodb:
        image: amazon/dynamodb-local
        ports:
            - 8000:8000
      consul:
        image: hashicorp/consul
        ports:
            - 8500:8500
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/get-go-version
        id: go-version
      - name: Make workspace
        run: make workspace
      - name: Build test service
        run: make build-contract-tests
      - name: Start test service in background
        run: make start-contract-test-service-bg
      - name: Clone and run contract tests from feat/fdv2 branch
        run: |
          mkdir -p /tmp/sdk-test-harness
          cd /tmp/sdk-test-harness
          git clone https://github.com/launchdarkly/sdk-test-harness.git .
          git checkout feat/fdv2
          go build -o test-harness .
          ./test-harness -url http://localhost:10000 -debug -stop-service-at-end
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test service logs
        uses: actions/upload-artifact@v4
        with:
          name: Contract-test-service-logs-feat-fdv2-${{ steps.go-version.outputs.version }}
          path: /tmp/sdk-contract-test-service.log

  benchmarks:
    name: 'Benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/benchmarks
