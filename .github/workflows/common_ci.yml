name: Common CI
on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version to use for the jobs."
        required: true
        type: string
permissions:
  contents: read

jobs:
  unit-test-and-coverage:
    runs-on: ubuntu-latest
    name: 'Unit Tests and Coverage'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/unit-tests
        with:
          lint: 'true'
          test-target: sdk-test
      - uses: ./.github/actions/coverage
        with:
          enforce: 'false'

  contract-tests:
    runs-on: ubuntu-latest
    name: 'Contract Tests'
    env:
      TEST_SERVICE_PORT: 10000

    steps:
      - uses: actions/checkout@v4
      - uses: launchdarkly/gh-actions/actions/persistent-stores@persistent-stores-v0
        with:
          redis: 'true'
          consul: 'true'
          dynamodb: 'true'
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/get-go-version
        id: go-version
      - name: Make workspace
        run: make workspace
      - name: Build test service
        run: make build-contract-tests
      - name: Start test service in background

        run: make start-contract-test-service-bg
      - name: Run SDK contract test v2
        uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1
        with:
          enable_persistence_tests: 'true'
          test_service_port: ${{ env.TEST_SERVICE_PORT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          stop_service: 'false'
      - name: Run SDK contract test v3
        uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1
        with:
          enable_persistence_tests: 'true'
          test_service_port: ${{ env.TEST_SERVICE_PORT }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v3.0.0-alpha.6

      - name: Upload test service logs
        uses: actions/upload-artifact@v4
        with:
          name: Contract-test-service-logs-${{ steps.go-version.outputs.version }}
          path: /tmp/sdk-contract-test-service.log

  benchmarks:
    name: 'Benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - uses: ./.github/actions/benchmarks
